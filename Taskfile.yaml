version: '3'
silent: true

tasks:
  build:
    deps: [clean]
    desc: Builds the dinodb projects into executables
    cmds:
      - go build ./cmd/dinodb
    aliases: [default]

  run:
    deps: [build]
    vars:
      PROJECT: '{{.PROJECT}}'
    desc: Runs dinodb with the specified project
    summary: |
      Builds and runs dinodb with the project specified in the PROJECT environment variable.
      Example usage: `task run PROJECT=go` where "go" is the name of the assignment.
    cmds: 
      - ./dinodb -project '{{.PROJECT}}'

  clean:
    desc: Deletes previous build executables/artifacts
    cmds:
      - rm -f dinodb

  test:
    desc: Runs assignment tests present in the "test" directory
    summary: |
      Runs assignment tests while checking for data races and timing out after 3 minutes.

      Usage:
        - Run all tests: `task test`
        - Run project:  `task test PROJECT=pager`
        - Run one test: `task test PROJECT=pager NAME=TestPager/testGetNewPage`
        - Run from file: `task test PROJECT=pager FILE=pager_hidden_test.go`

      If both NAME and FILE are unset, all tests in the project will run.
      If PROJECT is unset, tests from all subprojects will run.
    vars:
      PROJECT: '{{.PROJECT | default ""}}'
      NAME: '{{.NAME | default ""}}'
      FILE: '{{.FILE | default ""}}'
    cmds:
      - |
        if [ -n "{{.PROJECT}}" ]; then
          if [ -n "{{.FILE}}" ]; then
            TESTS=$(grep '^func Test' "./test/{{.PROJECT}}/{{.FILE}}" | sed -E 's/^func (Test[^(]+).*/\1/')
            if [ -z "$TESTS" ]; then
              echo "No test functions found in {{.FILE}}"
              exit 1
            fi
            REGEX=$(echo "$TESTS" | sed 's/.*/^&$/' | paste -sd '|' -)
            go test "./test/{{.PROJECT}}" -race -timeout 180s -run "$REGEX" -count=1
          elif [ -n "{{.NAME}}" ]; then
            go test "./test/{{.PROJECT}}" -race -timeout 180s -run "{{.NAME}}"
          else
            go test "./test/{{.PROJECT}}" -race -timeout 180s
          fi
        else
          go test ./test/... -race -timeout 180s
        fi

  test-verbose:
    desc: Runs assignment tests in verbose mode (-v), printing progress of each test
    summary: |
      Runs assignment tests in verbose mode while checking for data races and timing out after 3 minutes.

      Usage:
        - Run all tests: `task test-verbose`
        - Run project:  `task test-verbose PROJECT=pager`
    vars:
      PROJECT: '{{.PROJECT | default ""}}'
    cmds:
      - |
        if [ -n "{{.PROJECT}}" ]; then
          go test -v "./test/{{.PROJECT}}" -race -timeout 180s
        else
          go test -v ./test/... -race -timeout 180s
        fi

  format:
    desc: Formats all go files according to go's standards
    cmds:
      - gofmt -s -w .

